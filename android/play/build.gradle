plugins {
    id 'com.android.application'
}

// The Google Play edition of Cartographer's Apprentice: a Trusted Web Activity. Chrome opens
// the game's own site full screen (no URL bar once the site's asset links
// name this app's signing key); on a phone without a TWA-capable browser the
// app shows the site in its own WebView instead, so it opens either way.
//
// The same shape as Ironhold's and Chronicles of Elderon's Play editions,
// which Play accepted after their generated wrappers were rejected on
// 1 Nov 2026 for crashing at launch: android-browser-helper's launcher
// activity, splash screen and delegation service, a subclass of our own
// and nothing generated. In particular there is no Application class.
// tools/check-apk.js checks every APK built here before it goes anywhere.
//
// The game sells one unlock through Google Play Billing. The page reaches
// it through the Digital Goods API, which only a Trusted Web Activity has
// (js/billing.js is written for it): the billing module below and the
// payment components in the manifest are that bridge.

// The site the app opens. GitHub Pages serves this repository at
// https://taugustincst.github.io/project-shell-08/, and the asset links that vouch for
// this app live at https://taugustincst.github.io/.well-known/assetlinks.json.
def playHost = (project.hasProperty('playHost') ? project.property('playHost') : 'taugustincst.github.io').toString()
def playPath = (project.hasProperty('playPath') ? project.property('playPath') : '/project-shell-08/').toString()
def launchUrl = "https://${playHost}${playPath}"
def pathPrefix = playPath.replaceAll('/+$', '') ?: '/'

// Release signing: the upload key from android/keystore.properties when it
// exists (never committed), the debug key otherwise. Play only takes a
// bundle signed with the listing's upload key.
def keystoreFile = rootProject.file('keystore.properties')
def keystoreProps = new Properties()
if (keystoreFile.exists()) {
    keystoreFile.withInputStream { keystoreProps.load(it) }
}

// Every Play upload needs a higher versionCode than any earlier one. The
// release workflow derives it from the version (1.0.0 -> 10000).
def relVersionCode = (project.hasProperty('versionCode') ? project.property('versionCode') : '10000').toString().toInteger()
def relVersionName = (project.hasProperty('versionName') ? project.property('versionName') : '1.0.0').toString()

android {
    // The package name is the app's identity on Google Play: the listing was
    // created under it, and Play never lets it change.
    namespace 'com.taugustincst.cartographer'
    compileSdk 36

    defaultConfig {
        applicationId 'com.taugustincst.cartographer'
        minSdk 24
        targetSdk 36
        versionCode relVersionCode
        versionName relVersionName

        resValue 'string', 'launchUrl', launchUrl
        resValue 'string', 'hostName', playHost
        resValue 'string', 'webManifestUrl', launchUrl + 'manifest.webmanifest'
        resValue 'string', 'providerAuthority', 'com.taugustincst.cartographer.fileprovider'
        resValue 'integer', 'splashScreenFadeOutDuration', '300'
        // The app's side of the asset-links handshake: it names the site,
        // the site's assetlinks.json names the app and its key.
        resValue 'string', 'assetStatements',
            '[{\\"relation\\": [\\"delegate_permission/common.handle_all_urls\\"], ' +
            '\\"target\\": {\\"namespace\\": \\"web\\", \\"site\\": \\"https://' + playHost + '\\"}}]'
        manifestPlaceholders = [pathPrefix: pathPrefix]
    }

    signingConfigs {
        if (keystoreFile.exists()) {
            release {
                storeFile rootProject.file(keystoreProps['storeFile'])
                storePassword keystoreProps['storePassword']
                keyAlias keystoreProps['keyAlias']
                keyPassword keystoreProps['keyPassword']
            }
        }
    }

    buildTypes {
        release {
            // Nothing worth shrinking, and shrinking is one more way for a
            // class the manifest names to go missing from the dex.
            minifyEnabled false
            signingConfig keystoreFile.exists() ? signingConfigs.release : signingConfigs.debug
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    // The Trusted Web Activity launcher, splash screen, WebView fallback and
    // delegation service, and the Play Billing bridge the Digital Goods API
    // rides on. The versions Bubblewrap generates with.
    implementation 'com.google.androidbrowserhelper:androidbrowserhelper:2.7.4'
    implementation 'com.google.androidbrowserhelper:billing:1.2.0'
    implementation 'androidx.core:core:1.16.0'
}
